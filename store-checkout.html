<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PÉOPLE — Checkout</title><link rel="stylesheet" href="store-pages.css?v=7"></head><body><header class="storeHead"><a href="store.html">← BACK TO STORE</a><a class="storeHead__brand" href="index.html#top">PÉOPLE</a><span class="storeHead__right">SECURE CHECKOUT</span></header><main class="storePage storePage--split"><section class="checkoutDetails"><h1>CHECK<br>OUT.</h1><p class="storePage__intro">Complete your details and we’ll prepare your PÉOPLE order.</p><form class="storeForm checkoutForm" id="checkout-form"><label>EMAIL<input type="email" name="email" required></label><label>FULL NAME<input name="name" required></label><label>PHONE<input type="tel" name="phone" required></label><label>DELIVERY ADDRESS<input name="address" required></label><label>CITY<input name="city" required></label><div class="paymentSelect"><span>PAYMENT METHOD</span><button class="paymentSelect__trigger" type="button" aria-expanded="false"><b data-payment-value>SELECT PAYMENT METHOD</b><i>＋</i></button><div class="paymentSelect__menu"><label><input type="radio" name="payment" value="card" required><span><i class="cardIcon"></i><b>CREDIT CARD</b><em>VISA</em></span></label><label><input type="radio" name="payment" value="paypal" required><span><i class="paypalIcon">P</i><b>PAYPAL</b><em>PAYPAL</em></span></label></div></div><button class="storeButton" type="submit"><span data-checkout-action>CONTINUE</span><span>↗</span></button><div class="policyLinks"><a href="shipping-information.html">SHIPPING INFORMATION</a><a href="returns-exchanges.html">RETURNS & EXCHANGES</a><a href="store-terms.html">STORE TERMS</a></div></form></section><aside class="orderSummary"><h2>YOUR ORDER</h2><div data-order-items></div><div class="orderSummary__total"><span>TOTAL</span><strong data-order-total>₪ 0</strong></div></aside></main><script>const paymentSelect=document.querySelector('.paymentSelect'),paymentTrigger=document.querySelector('.paymentSelect__trigger'),paymentValue=document.querySelector('[data-payment-value]');paymentTrigger.addEventListener('click',()=>{const open=!paymentSelect.classList.contains('is-open');paymentSelect.classList.toggle('is-open',open);paymentTrigger.setAttribute('aria-expanded',String(open));paymentTrigger.querySelector('i').textContent=open?'−':'＋'});document.querySelectorAll('[name=payment]').forEach(input=>input.addEventListener('change',()=>{paymentValue.textContent=input.value==='card'?'CREDIT CARD · VISA':'PAYPAL';document.querySelector('[data-checkout-action]').textContent=input.value==='card'?'PLACE ORDER':'CONTINUE TO PAYPAL';paymentSelect.classList.remove('is-open');paymentTrigger.setAttribute('aria-expanded','false');paymentTrigger.querySelector('i').textContent='＋'}));document.addEventListener('click',e=>{if(!e.target.closest('.paymentSelect'))paymentSelect.classList.remove('is-open')});const cart=JSON.parse(localStorage.getItem('peopleStoreCart')||'[]');const items=document.querySelector('[data-order-items]');items.innerHTML=cart.length?cart.map(i=>`<article><img src="${i.image}" alt=""><div><h3>${i.name}</h3><p>${i.size?i.size+' · ':''}QTY ${i.quantity||1}</p></div><strong>${i.price}</strong></article>`).join(''):'<p>YOUR CART IS EMPTY.</p>';const total=cart.reduce((s,i)=>s+Number(String(i.price).replace(/[^0-9]/g,''))*(i.quantity||1),0);document.querySelector('[data-order-total]').textContent=`₪ ${total}`;document.getElementById('checkout-form').addEventListener('submit',e=>{e.preventDefault();if(!cart.length){location.href='store.html';return}const form=new FormData(e.currentTarget);const method=form.get('payment');if(!method)return;localStorage.setItem('peopleCheckoutDraft',JSON.stringify({email:form.get('email'),name:form.get('name'),phone:form.get('phone'),address:form.get('address'),city:form.get('city'),method,total}));if(method==='paypal'){location.href='store-payment.html?method=paypal';return}const order='PP'+String(Date.now()).slice(-8);localStorage.setItem('peopleLastOrder',JSON.stringify({order,cart,total,method,date:new Date().toISOString()}));localStorage.removeItem('peopleStoreCart');localStorage.removeItem('peopleCheckoutDraft');location.href=`order-confirmation.html?order=${order}`;});</script></body></html>
