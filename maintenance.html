<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maintenance — PÉOPLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;color:#000}
    body{min-height:100svh;font-family:"Albert Sans",Arial,sans-serif}
    main{min-height:100svh;display:grid;place-items:center;padding:20px}
    .maintenance{text-align:center;text-transform:uppercase}
    .maintenance__label{display:block;margin:0 0 .7rem;font-size:10px;font-weight:600;letter-spacing:.13em}
    h1{margin:0;font-size:clamp(1rem,1.35vw,1.35rem);font-weight:500;letter-spacing:-.035em}
    p{margin:.5rem 0 1.35rem;font-size:10px;line-height:1.35;letter-spacing:.025em}
    a{display:inline-block;color:inherit;font:600 10px/1 "Albert Sans",Arial,sans-serif;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
    a span{display:inline-block;margin-left:.35rem;transition:transform .25s ease}
    a:hover span,a:focus-visible span{transform:translateX(-.3rem)}
    a:focus-visible{outline:1px solid currentColor;outline-offset:7px}
  </style>
</head>
<body>
  <main>
    <section class="maintenance" aria-labelledby="maintenance-title">
      <span class="maintenance__label">PÉOPLE</span>
      <h1 id="maintenance-title">We’re making things better.</h1>
      <p>The site will be back shortly.</p>
      <a href="index.html">Back to the homepage <span aria-hidden="true">←</span></a>
    </section>
  </main>
</body>
</html>
