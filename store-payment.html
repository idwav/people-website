<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PÉOPLE — Payment</title><link rel="stylesheet" href="store-pages.css?v=6"></head><body><header class="storeHead"><a href="store-checkout.html">← BACK TO CHECKOUT</a><a class="storeHead__brand" href="index.html#top">PÉOPLE</a><span class="storeHead__right">SECURE PAYMENT</span></header><main class="storePage storePage--split paymentPage"><section><h1>ONE LAST<br>STEP.</h1><p class="storePage__intro" data-payment-intro></p></section><section class="paymentPanel"><div class="paymentPanel__head"><span>PAYMENT</span><strong data-payment-brand></strong></div><form class="storeForm checkoutForm" id="payment-form"><div data-card-fields><label>NAME ON CARD<input name="cardName" autocomplete="cc-name" required></label><label>CARD NUMBER<input name="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" required></label><div class="paymentPanel__row"><label>EXPIRY<input name="expiry" inputmode="numeric" placeholder="MM / YY" required></label><label>CVV<input name="cvv" inputmode="numeric" placeholder="•••" required></label></div></div><div class="paypalBox" data-paypal hidden><i class="paypalIcon">P</i><h2>CONTINUE WITH PAYPAL</h2><p>You’ll complete payment securely with your PayPal account.</p></div><div class="paymentPanel__total"><span>TOTAL</span><strong data-payment-total></strong></div><button class="storeButton" type="submit">PLACE ORDER <span>↗</span></button><p class="paymentPanel__fine">By placing the order you agree to our <a href="store-terms.html">Store Terms</a>.</p></form></section></main><script>const cart=JSON.parse(localStorage.getItem('peopleStoreCart')||'[]');if(!cart.length)location.href='store.html';const method=new URLSearchParams(location.search).get('method')||JSON.parse(localStorage.getItem('peopleCheckoutDraft')||'{}').method||'card';const total=cart.reduce((s,i)=>s+Number(String(i.price).replace(/[^0-9]/g,''))*(i.quantity||1),0);document.querySelector('[data-payment-total]').textContent=`₪ ${total}`;document.querySelector('[data-payment-brand]').textContent=method==='paypal'?'PAYPAL':'CREDIT CARD · VISA';document.querySelector('[data-payment-intro]').textContent=method==='paypal'?'Continue securely with PayPal, then your order is complete.':'Enter your card details securely, then place your order.';if(method==='paypal'){document.querySelector('[data-card-fields]').hidden=true;document.querySelectorAll('[data-card-fields] input').forEach(i=>i.required=false);document.querySelector('[data-paypal]').hidden=false}document.getElementById('payment-form').addEventListener('submit',e=>{e.preventDefault();const order='PP'+String(Date.now()).slice(-8);localStorage.setItem('peopleLastOrder',JSON.stringify({order,cart,total,method,date:new Date().toISOString()}));localStorage.removeItem('peopleStoreCart');localStorage.removeItem('peopleCheckoutDraft');location.href=`order-confirmation.html?order=${order}`});</script></body></html>
